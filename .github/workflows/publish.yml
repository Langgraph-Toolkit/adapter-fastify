name: CI and publish

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - uses: actions/checkout@v4
        with:
          repository: Langgraph-Toolkit/core
          ref: main
          path: .ci/core
      - name: Install core dependency
        working-directory: .ci/core
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build core dependency
        working-directory: .ci/core
        run: npm run build
      - name: Point adapter core dependency at checkout
        env:
          LOCAL_CORE: ${{ github.workspace }}/.ci/core
        run: node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies["@langgraph-toolkit/core"]=`file:${process.env.LOCAL_CORE}`; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm run build
      - run: npm run test --if-present

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - uses: actions/checkout@v4
        with:
          repository: Langgraph-Toolkit/core
          ref: main
          path: .ci/core
      - name: Install core dependency
        working-directory: .ci/core
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build core dependency
        working-directory: .ci/core
        run: npm run build
      - name: Point adapter core dependency at checkout
        env:
          LOCAL_CORE: ${{ github.workspace }}/.ci/core
        run: node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.dependencies["@langgraph-toolkit/core"]=`file:${process.env.LOCAL_CORE}`; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm run build
      - name: Restore registry dependency metadata
        run: git checkout -- package.json
      - run: npm publish --access public --provenance
